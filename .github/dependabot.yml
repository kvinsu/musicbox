version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      # yt-dlp has to keep up with YouTube changes
      interval: daily
    groups:
      # Batch routine bumps; yt-dlp and discord.py stay separate so a breaking release is easy to spot
      python-packages:
        patterns: ['*']
        exclude-patterns: [yt-dlp, discord.py]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
