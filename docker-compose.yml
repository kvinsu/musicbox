services:
  musicbot:
    build: .
    container_name: discord-musicbot
    restart: unless-stopped
    # Settings and their defaults are documented in the README
    env_file:
      - .env
    deploy:
      # Limit resources (optional)
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
